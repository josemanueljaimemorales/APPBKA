<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AKC PRO</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="app">

    <!-- PANTALLA HOME -->
    <div id="home" class="screen active">

        <div class="header">
            <img src="logo.png" class="logo" alt="AKC Logo">
            <h1>AKC PRO</h1>
        </div>

        <div class="menu">

            <button class="btn" onclick="openScreen('basicos')">
                📗 Básicos
            </button>

        </div>

    </div>

    <!-- PANTALLA VISOR -->
    <div id="viewerScreen" class="screen">

        <div class="header">
            <button class="btn" onclick="goHome()">⬅ Regresar</button>
        </div>

        <iframe
            id="viewerFrame"
            src=""
            width="100%"
            height="100%"
            style="border:none;">
        </iframe>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
